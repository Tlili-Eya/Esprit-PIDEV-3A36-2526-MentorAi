# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration

parameters:
    pdp_directory: '%kernel.project_dir%/public/uploads/pdp'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    groq_api_key_empty: ''
    groq_api_key: '%env(default:groq_api_key_empty:GROQ_API_KEY)%'
    groq_model: '%env(GROQ_MODEL)%'
    elevenlabs_api_key: '%env(ELEVENLABS_API_KEY)%'
    elevenlabs_voice_id: '%env(ELEVENLABS_VOICE_ID)%'
    cloudinary_cloud_name: '%env(CLOUDINARY_CLOUD_NAME)%'
    cloudinary_api_key: '%env(CLOUDINARY_API_KEY)%'
    cloudinary_api_secret: '%env(CLOUDINARY_API_SECRET)%'
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Controller\CourController:
        arguments:
            $groqApiKey: '%groq_api_key%'
            $groqModel: '%groq_model%'
            $elevenLabsApiKey: '%elevenlabs_api_key%'
            $cloudName: '%cloudinary_cloud_name%'
            $cloudApiKey: '%cloudinary_api_key%'
            $cloudApiSecret: '%cloudinary_api_secret%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ✅ Service d'analyse d'émotions Azure
    App\Service\AzureEmotionAnalysisService:
        arguments:
            $azureEndpoint: '%env(AZURE_TEXT_ANALYTICS_ENDPOINT)%'
            $azureApiKey: '%env(AZURE_TEXT_ANALYTICS_KEY)%'

    # ✅ Service DeepSeek
    App\Service\DeepSeekService:
        arguments:
            $apiKey: '%env(DEEPSEEK_API_KEY)%'
            $httpClient: '@http_client'
            $requestStack: '@request_stack'
            $logger: '@logger'

    # ✅ Commande de test DeepSeek
    App\Command\TestDeepSeekCommand:
        arguments:
            $apiKey: '%env(DEEPSEEK_API_KEY)%'

    # ✅ Service Ollama
    App\Service\OllamaService:
        arguments:
            $logger: '@logger'

security:
    firewalls:
        main:
            form_login:
                remember_me: false
    hide_user_not_found: false